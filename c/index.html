<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>체험단 진행 현황</title>

<!-- 광고주 뷰어 — 주소 해시(#t=토큰)로 자기 캠페인만 RPC 로 읽어 그린다.
     deploy_pages.py 가 {{...}} 를 채워 GitHub Pages 에 올리는 셸이다.

     ⭐이 파일이 화면의 **유일한 정본**이다. 로컬 미리보기(--open)도 이 파일을 그대로
       읽어 window.__XHS_PRELOAD__ 만 심어 쓴다 (xhs_watch.render_html).
       예전엔 template.html 에 같은 표를 파이썬으로 한 벌 더 그렸는데, 손볼 때마다
       두 곳이 갈라져서 없앴다. 표 모양을 고칠 곳은 여기 하나뿐이다.

     ⛔여기 들어오는 rows 는 이미 allowlist 를 통과한 값이다. 새 필드를 그리려면
       xhs_watch.parse_rows 의 col_kind 부터 봐야 한다 — 노션 본문엔 정산액·담당자
       실명이 섞여 있다. -->
<style>
/* ── 토큰 ──────────────────────────────────────────────────────────────────
   중립색에 레드 기미를 섞었다. 샤오홍슈 레드(#F0263C) 옆에서 순회색은 이물감이 난다.
   ⭐상태색은 액센트와 분리한다 — 레드가 브랜드이자 '경고'로 동시에 읽히면 안 된다.  */
:root{
  --ground:#FBF9F9;  --surface:#FFFFFF;  --raise:#F5F1F2;
  --ink:#191214;     --ink-2:#5C5054;    --ink-3:#8A7E81;
  --line:#EBE3E4;    --line-2:#DED4D6;
  --brand:#F0263C;
  --done:#0D7A5F;    --done-bg:#E4F1EC;
  --wait:#B07314;    --wait-bg:#F7EEDD;
  --plan:#2E6BB8;    --plan-bg:#E6EDF8;
  --idle:#8A7E81;    --idle-bg:#EFEAEB;
  --void:#CFC5C7;
  --shadow:0 1px 2px rgba(25,18,20,.04), 0 8px 24px -12px rgba(25,18,20,.10);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#131011; --surface:#1C1618; --raise:#241D20;
    --ink:#F2ECED;    --ink-2:#B4A8AB;  --ink-3:#8D8083;
    --line:#2C2326;   --line-2:#3A2F32;
    --brand:#FF4257;
    --done:#3FC79E;   --done-bg:#123329;
    --wait:#E3A63C;   --wait-bg:#33280F;
    --plan:#6DA4E8;   --plan-bg:#122336;
    --idle:#8D8083;   --idle-bg:#272022;
    --void:#403538;
    --shadow:none;
  }
}
/* 뷰어 테마 토글이 있는 환경에서는 그쪽이 이긴다 (양방향 모두 명시) */
:root[data-theme="dark"]{
  --ground:#131011; --surface:#1C1618; --raise:#241D20;
  --ink:#F2ECED;    --ink-2:#B4A8AB;  --ink-3:#8D8083;
  --line:#2C2326;   --line-2:#3A2F32;
  --brand:#FF4257;
  --done:#3FC79E;   --done-bg:#123329;
  --wait:#E3A63C;   --wait-bg:#33280F;
  --plan:#6DA4E8;   --plan-bg:#122336;
  --idle:#8D8083;   --idle-bg:#272022;
  --void:#403538;   --shadow:none;
}
:root[data-theme="light"]{
  --ground:#FBF9F9; --surface:#FFFFFF; --raise:#F5F1F2;
  --ink:#191214;    --ink-2:#5C5054;  --ink-3:#8A7E81;
  --line:#EBE3E4;   --line-2:#DED4D6;
  --brand:#F0263C;
  --done:#0D7A5F;   --done-bg:#E4F1EC;
  --wait:#B07314;   --wait-bg:#F7EEDD;
  --plan:#2E6BB8;   --plan-bg:#E6EDF8;
  --idle:#8A7E81;   --idle-bg:#EFEAEB;
  --void:#CFC5C7;
  --shadow:0 1px 2px rgba(25,18,20,.04), 0 8px 24px -12px rgba(25,18,20,.10);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; padding:0; background:var(--ground); color:var(--ink);
  font:400 15px/1.62 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
       "Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* 아이디·숫자는 라틴/숫자라 등폭이 실제로 읽기 편하고, 열이 자로 잰 듯 맞는다 */
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}

.wrap{max-width:1040px; margin:0 auto; padding:28px 18px 72px;
  display:flex; flex-direction:column; gap:14px}

/* ── 머리말 ── */
.head{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between;
  gap:6px 16px; padding-bottom:2px}
.who{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap}
.who h1{margin:0; font-size:23px; font-weight:800; letter-spacing:-.035em; text-wrap:balance}
.who .mark{color:var(--brand)}
.who .kind{font-size:12px; font-weight:600; letter-spacing:.09em; color:var(--ink-3);
  border:1px solid var(--line-2); border-radius:999px; padding:3px 9px; white-space:nowrap}
.stamp{font-size:12.5px; color:var(--ink-3); white-space:nowrap}

/* ── 이행 현황 (이 페이지의 논지) ── */
.deal{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:20px 20px 17px;
  display:flex; flex-direction:column; gap:15px}
.deal-top{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
  gap:14px 22px}
.score{display:flex; align-items:baseline; gap:9px; line-height:1}
.score .n{font-size:52px; font-weight:800; letter-spacing:-.05em; color:var(--brand)}
.score .of{font-size:23px; font-weight:600; color:var(--ink-3); letter-spacing:-.02em}
.score .cap{font-size:13px; color:var(--ink-2); font-weight:600; padding-bottom:3px}
.spec{text-align:right; font-size:13px; color:var(--ink-2)}
.spec dt{font-size:11px; font-weight:700; letter-spacing:.1em; color:var(--ink-3);
  text-transform:uppercase; margin-bottom:4px}
.spec dd{margin:0; display:flex; gap:14px; justify-content:flex-end; flex-wrap:wrap}
.spec b{font-weight:700; color:var(--ink)}

/* 계약 1건 = 칸 1개. 아래 표의 번호와 1:1로 맞물린다 — 장식이 아니라 색인이다. */
.meter{display:flex; gap:3px; align-items:stretch}
.meter i{flex:1 1 0; min-width:0; height:13px; border-radius:3px; background:var(--void);
  display:block; transition:transform .12s ease}
.meter i:hover{transform:scaleY(1.35)}
.m-uploaded{background:var(--done)!important}
.m-visited{background:var(--plan)!important}
.m-scheduled{background:var(--wait)!important}
.m-recruited{background:var(--idle)!important}
.m-cancelled{background:repeating-linear-gradient(135deg,var(--void),var(--void) 2px,
  transparent 2px,transparent 4px)!important}
.m-unfilled{background:transparent!important; border:1px dashed var(--line-2)}

.keys{display:flex; flex-wrap:wrap; gap:5px 16px; font-size:12.5px; color:var(--ink-2)}
.keys span{display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
.keys u{text-decoration:none; width:9px; height:9px; border-radius:2px; background:var(--void);
  flex:none}
.keys b{font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums}

/* ── 명단 ── */
.list{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); overflow:hidden}
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{width:100%; border-collapse:collapse; font-size:14px; min-width:680px}
thead th{position:sticky; top:0; background:var(--raise); z-index:1;
  font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--ink-3);
  text-align:left; padding:11px 12px; white-space:nowrap;
  border-bottom:1px solid var(--line)}
td{padding:12px; border-top:1px solid var(--line); vertical-align:middle}
tbody tr:first-child td{border-top:none}
.c{text-align:center; white-space:nowrap}
.num{width:44px; color:var(--ink-3); font-size:12.5px}
.who-cell{min-width:210px}
.idn{font-weight:650; letter-spacing:-.01em; word-break:break-all}
.note{font-size:12px; color:var(--ink-3); margin-top:3px; line-height:1.45;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
tr.s-cancelled{color:var(--ink-3)}
tr.s-cancelled .idn{font-weight:500}
tr.s-unfilled td{background:repeating-linear-gradient(135deg,transparent,transparent 7px,
  var(--raise) 7px,var(--raise) 14px)}

.tag{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11.5px;
  font-weight:700; white-space:nowrap; letter-spacing:-.01em}
.t-uploaded{background:var(--done-bg); color:var(--done)}
.t-visited{background:var(--plan-bg); color:var(--plan)}
.t-scheduled{background:var(--wait-bg); color:var(--wait)}
.t-recruited{background:var(--idle-bg); color:var(--idle)}
.t-cancelled{background:var(--idle-bg); color:var(--idle)}
.t-unfilled{background:transparent; color:var(--ink-3); border:1px dashed var(--line-2)}

.go{display:inline-flex; align-items:center; gap:5px; padding:6px 12px; border-radius:9px;
  background:var(--brand); color:#fff; text-decoration:none; font-size:12.5px; font-weight:700;
  white-space:nowrap; letter-spacing:-.01em}
.go:hover{filter:brightness(1.07)}
.go.alt{background:transparent; color:var(--ink-2); border:1px solid var(--line-2)}
.go.alt:hover{filter:none; border-color:var(--ink-3); color:var(--ink)}
a:focus-visible,.go:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
.dash{color:var(--void)}

.foot{font-size:12px; color:var(--ink-3); line-height:1.75; padding:0 2px}
.state{padding:56px 18px; text-align:center; color:var(--ink-2); font-size:14.5px}

@media (max-width:680px){
  .wrap{padding:20px 13px 56px; gap:12px}
  .who h1{font-size:20px}
  .deal{padding:17px 16px 15px; gap:13px}
  .deal-top{gap:12px}
  .score .n{font-size:44px}
  .spec{text-align:left}
  .spec dd{justify-content:flex-start}
  .meter i{height:15px}

  /* 표를 카드로 접는다. 광고주 링크는 대부분 카톡으로 폰에서 열리므로 이쪽이 기본 화면이다. */
  table{min-width:0}
  thead{display:none}
  tbody,tr,td{display:block}
  tbody tr{position:relative; padding:15px 15px 13px; border-top:1px solid var(--line)}
  tbody tr:first-child{border-top:none}
  td{border:none; padding:2px 0; text-align:left!important; white-space:normal}
  td::before{content:attr(data-l); color:var(--ink-3); font-size:12px;
    display:inline-block; min-width:80px}
  td.num{position:absolute; top:15px; right:15px; width:auto; padding:0; font-size:12px}
  td.num::before{content:"No."; min-width:0; margin-right:4px}
  td.who-cell{font-size:16.5px; padding-right:54px; margin-bottom:8px}
  td.who-cell::before{display:none}
  td.act{margin-top:10px}
  td.act::before{display:none}
  td.dash{display:none}                 /* 빈 칸은 카드에서 아예 뺀다 */
  tr.s-unfilled td{background:none}
  tr.s-unfilled{background:repeating-linear-gradient(135deg,transparent,transparent 7px,
    var(--raise) 7px,var(--raise) 14px)}
  .note{-webkit-line-clamp:3}
  .go{padding:9px 16px; font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="state" id="loading">현황을 불러오는 중입니다…</div>
</div>
<!--PRELOAD-->
<script>
const SB_URL = 'https://ndjxaikbjtolyvneeisv.supabase.co';
const SB_KEY = 'sb_publishable_vWn5MxEdB2sUuDZVshqZ2A_9bx8aTVA';

/* 상태 순서 = 계약 이행에 가까운 순. 범례·집계 모두 이 순서를 따른다. */
const STATES = [
  ['uploaded',  '리뷰 업로드 완료'],
  ['visited',   '방문 완료 · 리뷰 대기'],
  ['scheduled', '방문 예정'],
  ['recruited', '섭외 완료 · 일정 미정'],
  ['cancelled', '취소'],
  ['unfilled',  '미선정'],
];
const LABEL = Object.fromEntries(STATES);

/* 계약 구성 구간. xhs_watch.FOLLOWER_TIERS 와 같은 키·같은 순서를 쓴다. */
const TIERS = [['f1k', '1천 이상'], ['f10k', '1만 이상']];

function esc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function cnum(v){ const n = parseInt(String(v ?? '').trim(), 10); return n > 0 ? n : null; }

/* 계약 건수만큼 번호 자리를 채운다 — 사람이 안 정해진 자리는 '미선정'.
   ⭐자리는 계약 건수까지만 만든다. 노션 표에는 쓰지도 않을 빈 행이 남아 있어서
     그걸 따라가면 있지도 않은 자리가 생긴다 (마케터 지적, 2026-08-31).
   ⭐표시 전용이다 — summary(진행 인원 등)는 서버에서 온 값을 그대로 쓴다. */
/* 빈 자리를 '미선정' 으로 채운다.

   ⭐**취소 칸은 그대로 남고, 대체 인원은 다음 번호로 새로 등록된다**
     (2026-09-01 마케터 확정: "취소칸은 그냥 취소로 남겨둘거야. 추가로 모집되면
     16,17,18번으로 등록되는거지"). 그래서 채울 자리 수는 **남은 자리**
     (= 계약 − 확보인원)이고, 번호는 1부터 메우는 게 아니라 **마지막 번호 다음**부터다.
   ⛔ 예전처럼 `1..계약건수` 의 빈 번호를 메우면, 취소 3건이 그 범위 안에 있을 때
     미선정 칸이 1개만 생기는데 머리말은 '남은 자리 4건' 이라고 말한다 — 실제로
     그렇게 어긋나 있었다. 표의 미선정 칸 수와 '남은 자리' 는 **항상 같아야 한다.**
   ⛔ 중간에 빠진 번호를 억지로 만들지 않는다. 외주사가 안 쓴 번호는 없는 자리다. */
function padRows(rows, contract){
  const c = cnum(contract);
  const out = (rows || []).slice();
  if (!c) return out;
  const HELD = r => r.status !== 'cancelled' && r.status !== 'unfilled'
                 && r.status !== 'empty';
  const alive = out.filter(HELD).length;
  let next = out.reduce((m, r) => Math.max(m, parseInt(r.no, 10) || 0), 0) + 1;
  for (let i = alive; i < c; i++, next++){
    out.push({ no: String(next), id:'', followers:'', reactions:'', visit:'',
               xhs:'', xhs_title:'', dp:'', key:'pad-' + next, status:'unfilled' });
  }
  return out.sort((a, b) => (parseInt(a.no,10) || 1e6) - (parseInt(b.no,10) || 1e6));
}

/* 칸 하나 = 표의 한 줄. 번호와 1:1로 맞물려서, 색만 보고도 어느 자리가 비었는지 안다.
   취소가 나면 그 칸은 회색으로 남고 대체 인원의 칸이 뒤에 붙으므로, 칸 수가 계약
   건수보다 많아질 수 있다 — 그게 "15자리 계약인데 3명 취소돼 3명 더 섭외했다" 는 뜻이다. */
function meterHtml(rows){
  return '<div class="meter" role="img" aria-label="계약 자리별 진행 상태">'
    + rows.map(r => '<i class="m-' + r.status + '" title="'
        + esc('No.' + r.no + ' · ' + (LABEL[r.status] || r.status)) + '"></i>').join('')
    + '</div>';
}

function keysHtml(rows){
  const n = {};
  rows.forEach(r => { n[r.status] = (n[r.status] || 0) + 1; });
  return '<div class="keys">' + STATES.filter(([k]) => n[k])
    .map(([k, label]) => '<span><u class="m-' + k + '"></u>' + label
      + ' <b>' + n[k] + '</b></span>').join('') + '</div>';
}

/* 계약 구성 — 관리화면에 입력한 값을 그대로 낸다.
   ⛔실제 섭외 인원으로 대신 채우지 말 것. 계약과 실제는 다를 수 있고,
     광고주에게는 계약 값만 정확히 보여야 한다 (마케터 지시, 2026-08-31). */
function specHtml(contract, tiers){
  const t = tiers || {};
  const items = TIERS.filter(([k]) => cnum(t[k]))
    .map(([k, label]) => '<span>' + label + ' <b>' + cnum(t[k]) + '명</b></span>');
  if (!items.length) return '';
  return '<dl class="spec"><dt>계약 구성</dt><dd>' + items.join('') + '</dd></dl>';
}

function rowHtml(r){
  const st = r.status || 'recruited';
  const cell = (label, html, empty, cls) =>
    '<td class="c' + (empty ? ' dash' : '') + (cls ? ' ' + cls : '') +
    '" data-l="' + label + '">' + (empty ? '—' : html) + '</td>';

  const review = r.xhs
    ? '<a class="go" href="' + esc(r.xhs) + '" target="_blank" rel="noopener nofollow">리뷰 보기</a>'
      + (r.dp ? ' <a class="go alt" href="' + esc(r.dp) +
        '" target="_blank" rel="noopener nofollow">디엔핑</a>' : '')
    : '';
  // 취소·미선정 행은 이름 칸이 비거나 '취소' 글자라 상태 배지와 겹친다 — 배지에 맡긴다
  const named = (st === 'cancelled' || st === 'unfilled') ? '' : esc(r.id);
  const note = r.xhs_title ? '<div class="note">' + esc(r.xhs_title) + '</div>' : '';

  return '<tr class="s-' + st + '">'
    + '<td class="c num">' + esc(r.no) + '</td>'
    + '<td class="who-cell"><span class="idn' + (named ? ' mono' : '') + '">'
      + (named || '—') + '</span>' + note + '</td>'
    + cell('팔로워', '<span class="mono">' + esc(r.followers) + '</span>', !r.followers)
    + cell('좋아요·저장', '<span class="mono">' + esc(r.reactions) + '</span>', !r.reactions)
    + cell('방문 일시', '<span class="mono">' + esc(r.visit) + '</span>', !r.visit)
    + cell('상태', '<span class="tag t-' + st + '">' + esc(LABEL[st] || st) + '</span>')
    + cell('리뷰', review, !review, 'act')
    + '</tr>';
}

function render(d){
  const s = d.summary || {};
  const contract = cnum(d.contract ?? s.contract);
  const rows = padRows(d.rows, contract);
  const done = s.uploaded || 0;

  document.title = d.name + ' 샤오홍슈 체험단 현황';
  document.getElementById('app').innerHTML = `
    <header class="head">
      <div class="who">
        <h1><span class="mark">${esc(d.name)}</span> 체험단 진행 현황</h1>
        <span class="kind">샤오홍슈 小红书</span>
      </div>
      <div class="stamp">마지막 확인 ${esc(d.fetched_at || '—')}</div>
    </header>

    <section class="deal">
      <div class="deal-top">
        <div class="score">
          <span class="n mono">${done}</span>
          ${contract ? `<span class="of mono">/ ${contract}</span>` : ''}
          <span class="cap">리뷰 업로드 완료</span>
        </div>
        ${specHtml(contract, d.tiers)}
      </div>
      ${rows.length ? meterHtml(rows) + keysHtml(rows) : ''}
    </section>

    <section class="list"><div class="scroll">
      <table>
        <thead><tr>
          <th class="c">No.</th><th>인플루언서</th><th class="c">팔로워</th>
          <th class="c">좋아요·저장</th><th class="c">방문 일시</th>
          <th class="c">상태</th><th class="c">리뷰</th>
        </tr></thead>
        <tbody>${rows.map(rowHtml).join('') ||
          '<tr><td colspan="7" class="state">아직 등록된 체험단이 없습니다.</td></tr>'}</tbody>
      </table>
    </div></section>

    <footer class="foot">
      마지막 변경 ${esc(d.last_change || '—')} · 이 페이지는 자동으로 갱신됩니다.<br>
      좋아요·저장 수는 집계 시점에 따라 달라질 수 있습니다.
    </footer>`;
}

function fail(msg){
  document.getElementById('app').innerHTML = '<div class="state">' + esc(msg) + '</div>';
}

async function boot(){
  // 로컬 미리보기(--open)는 데이터를 심어 두고 열린다 — 네트워크를 타지 않는다
  if (window.__XHS_PRELOAD__){ render(window.__XHS_PRELOAD__); return; }
  const t = new URLSearchParams(location.hash.slice(1)).get('t');
  if (!t){ fail('주소가 올바르지 않습니다. 전달받은 링크를 다시 확인해 주세요.'); return; }
  try{
    const r = await fetch(SB_URL + '/rest/v1/rpc/xhs_page', {
      method: 'POST',
      headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ t })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (!d || !d.name){ fail('주소가 올바르지 않거나 캠페인이 종료되었습니다.'); return; }
    render(d);
  }catch(e){
    fail('일시적으로 불러오지 못했습니다. 잠시 후 새로고침해 주세요.');
  }
}
boot();
</script>
</body>
</html>
