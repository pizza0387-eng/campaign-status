<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>체험단 진행 현황</title>
<!-- 광고주 뷰어 — 주소 해시(#t=토큰)로 자기 캠페인 데이터만 RPC 조회해 그린다.
     이 파일은 deploy_pages.py 가 {{...}} 를 채워 GitHub Pages 에 올리는 셸이다.
     ⚠ 표 모양을 바꾸면 로컬 미리보기(template.html)도 같이 고칠 것. -->
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e6e8ec; --tx:#1a1d21; --dim:#6b7280;
    --red:#ff2442; --ok:#0f9d58; --wait:#f0a020; --off:#9aa0a6;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#14161a; --card:#1c1f24; --line:#2c3037; --tx:#e8eaed; --dim:#9aa0a6; }
  }
  *{box-sizing:border-box}
  body{margin:0;padding:20px 14px 60px;background:var(--bg);color:var(--tx);
    font:15px/1.6 -apple-system,"Segoe UI","Malgun Gothic","맑은 고딕",sans-serif}
  .wrap{max-width:1000px;margin:0 auto}
  h1{font-size:21px;margin:0 0 4px;letter-spacing:-.4px}
  h1 b{color:var(--red)}
  .sub{color:var(--dim);font-size:13px;margin-bottom:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));
    gap:9px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:13px 12px;text-align:center}
  .card .n{font-size:26px;font-weight:700;line-height:1.15;letter-spacing:-1px}
  .card .l{font-size:12px;color:var(--dim);margin-top:3px}
  .card.hl .n{color:var(--red)}
  .tbox{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:660px}
  th{background:rgba(128,128,128,.07);font-size:12px;color:var(--dim);font-weight:600;
    text-align:left;padding:11px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
  td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .c{text-align:center;white-space:nowrap}
  .idn{font-weight:600;word-break:break-all}
  .ttl{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .empty{color:var(--dim);padding:40px 10px;text-align:center}
  tr.s-cancelled td{opacity:.45}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;
    font-weight:600;white-space:nowrap}
  .t-uploaded{background:rgba(15,157,88,.13);color:var(--ok)}
  .t-scheduled{background:rgba(240,160,32,.15);color:var(--wait)}
  .t-recruited{background:rgba(128,128,128,.15);color:var(--dim)}
  .t-cancelled{background:rgba(154,160,166,.15);color:var(--off)}
  .btn{display:inline-block;padding:5px 11px;border-radius:7px;background:var(--red);
    color:#fff;text-decoration:none;font-size:12px;font-weight:600;white-space:nowrap}
  .btn2{background:transparent;color:var(--dim);border:1px solid var(--line)}
  .btn:hover{opacity:.85}
  .foot{margin-top:16px;color:var(--dim);font-size:12px;line-height:1.8}
  @media (max-width:640px){
    table{min-width:0}
    thead{display:none}
    tbody,tr,td{display:block}
    tr{position:relative;padding:14px 14px 12px;border-bottom:1px solid var(--line)}
    td{border:none;padding:3px 0;text-align:left!important;white-space:normal}
    td::before{content:attr(data-l);color:var(--dim);font-size:12px;
      display:inline-block;min-width:86px;vertical-align:top}
    td[data-l="No."]{position:absolute;top:14px;right:14px;padding:0;
      color:var(--dim);font-size:12px}
    td[data-l="No."]::before{content:"No.";min-width:0;margin-right:4px}
    td[data-l="인플루언서"]{font-size:16px;padding-right:52px;margin-bottom:7px}
    td[data-l="인플루언서"]::before{display:none}
    td[data-l="리뷰"]{margin-top:9px}
    td[data-l="리뷰"]::before{display:none}
    td.dash{display:none}
    .ttl{-webkit-line-clamp:3}
    .btn{padding:8px 16px;font-size:13px}
    .empty{padding:30px 10px}
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="empty" id="loading">현황을 불러오는 중입니다…</div>
</div>

<script>
const SB_URL = 'https://ndjxaikbjtolyvneeisv.supabase.co';
const SB_KEY = 'sb_publishable_vWn5MxEdB2sUuDZVshqZ2A_9bx8aTVA';
const LABEL = { uploaded:'리뷰 업로드 완료', scheduled:'방문 예정',
                recruited:'섭외 완료', cancelled:'취소' };

function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function fail(msg){
  document.getElementById('app').innerHTML =
    '<div class="empty">' + esc(msg) + '</div>';
}

function td(label, html, empty){
  return '<td class="c' + (empty ? ' dash' : '') + '" data-l="' + label + '">'
       + (empty ? '—' : html) + '</td>';
}

function render(d){
  const s = d.summary || {};
  const rows = d.rows || [];
  const trs = rows.map(r => {
    const st = r.status || 'recruited';
    const review = !r.xhs ? '—'
      : '<a class="btn" href="' + esc(r.xhs) + '" target="_blank" rel="noopener nofollow">리뷰 보기</a>';
    const dp = !r.dp ? ''
      : ' <a class="btn btn2" href="' + esc(r.dp) + '" target="_blank" rel="noopener nofollow">디엔핑</a>';
    const title = r.xhs_title ? '<div class="ttl">' + esc(r.xhs_title) + '</div>' : '';
    const who = st === 'cancelled' ? '' : esc(r.id);   // 취소 행은 상태 배지와 겹치니 비운다
    return '<tr class="s-' + st + '">'
      + td('No.', esc(r.no))
      + '<td data-l="인플루언서"><span class="idn">' + (who || '—') + '</span>' + title + '</td>'
      + td('팔로워', esc(r.followers), !r.followers)
      + td('좋아요·저장', esc(r.reactions), !r.reactions)
      + td('방문 일시', esc(r.visit), !r.visit)
      + td('상태', '<span class="tag t-' + st + '">' + (LABEL[st] || st) + '</span>')
      + td('리뷰', review + dp, !r.xhs)
      + '</tr>';
  }).join('');

  document.title = d.name + ' 샤오홍슈 체험단 현황';
  document.getElementById('app').innerHTML = `
    <h1><b>${esc(d.name)}</b> 샤오홍슈(小红书) 체험단 현황</h1>
    <div class="sub">인플루언서 방문 일정과 업로드된 리뷰를 실시간으로 확인하실 수 있습니다.</div>
    <div class="cards">
      <div class="card hl"><div class="n">${s.total ?? 0}</div><div class="l">진행 인원</div></div>
      <div class="card"><div class="n">${s.uploaded ?? 0}</div><div class="l">리뷰 업로드</div></div>
      <div class="card"><div class="n">${s.scheduled ?? 0}</div><div class="l">방문 예정</div></div>
      <div class="card"><div class="n">${s.recruited ?? 0}</div><div class="l">섭외 완료</div></div>
      <div class="card"><div class="n">${s.cancelled ?? 0}</div><div class="l">취소</div></div>
    </div>
    <div class="tbox"><div class="scroll">
      <table>
        <thead><tr>
          <th class="c">No.</th><th>인플루언서</th><th class="c">팔로워</th>
          <th class="c">좋아요·저장</th><th class="c">방문 일시</th>
          <th class="c">상태</th><th class="c">리뷰</th>
        </tr></thead>
        <tbody>${trs ||
          '<tr><td colspan="7" class="c empty">아직 등록된 체험단이 없습니다.</td></tr>'}</tbody>
      </table>
    </div></div>
    <div class="foot">
      마지막 확인 : ${esc(d.fetched_at || '—')} &nbsp;·&nbsp; 마지막 변경 : ${esc(d.last_change || '—')}<br>
      이 페이지는 자동으로 갱신됩니다. 좋아요·저장 수는 집계 시점에 따라 달라질 수 있습니다.
    </div>`;
}

async function boot(){
  const t = new URLSearchParams(location.hash.slice(1)).get('t');
  if (!t){ fail('주소가 올바르지 않습니다. 전달받은 링크를 다시 확인해 주세요.'); return; }
  try{
    const r = await fetch(SB_URL + '/rest/v1/rpc/xhs_page', {
      method: 'POST',
      headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ t })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (!d || !d.name){ fail('주소가 올바르지 않거나 캠페인이 종료되었습니다.'); return; }
    render(d);
  }catch(e){
    fail('일시적으로 불러오지 못했습니다. 잠시 후 새로고침해 주세요.');
  }
}
boot();
</script>
</body>
</html>
