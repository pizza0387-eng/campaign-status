<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>샤오홍슈 체험단 관리</title>
<!-- 이 파일은 셸이다. deploy_pages.py 가 {{...}} 를 채워 GitHub Pages 에 올린다.
     데이터는 전부 로그인해야만 보인다 (publishable 키는 공개용으로 설계된 키). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --bg:#14161a; --card:#1c1f24; --line:#2c3037; --tx:#e8eaed; --dim:#9aa0a6;
         --red:#ff2442; --ok:#34d399; --warn:#fbbf24; }
  *{box-sizing:border-box}
  body{margin:0;padding:20px 14px 60px;background:var(--bg);color:var(--tx);
    font:15px/1.6 -apple-system,"Segoe UI","Malgun Gothic",sans-serif}
  .wrap{max-width:860px;margin:0 auto}
  h1{font-size:20px;margin:0 0 2px} h1 b{color:var(--red)}
  .sub{color:var(--dim);font-size:13px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin-bottom:14px}
  input,button{font:inherit;border-radius:8px;border:1px solid var(--line)}
  input{width:100%;padding:9px 11px;background:#111317;color:var(--tx);margin:4px 0 10px}
  input:focus{outline:1px solid var(--red)}
  button{padding:9px 16px;background:var(--red);color:#fff;border:none;cursor:pointer;font-weight:600}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
  button:disabled{opacity:.5;cursor:default}
  label{font-size:12px;color:var(--dim)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .cl{border-top:1px solid var(--line);padding:13px 0}
  .cl:first-child{border-top:none;padding-top:2px}
  .nm{font-size:16px;font-weight:700}
  .st{font-size:13px;color:var(--dim);margin:2px 0 8px}
  .st b{color:var(--tx)}
  .badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600}
  .b-ok{background:rgba(52,211,153,.15);color:var(--ok)}
  .b-warn{background:rgba(251,191,36,.15);color:var(--warn)}
  .b-off{background:rgba(154,160,166,.15);color:var(--dim)}
  .lnk{font-size:12px;color:var(--dim);word-break:break-all}
  .btn-s{padding:6px 12px;font-size:13px}
  .msg{color:var(--warn);font-size:13px;min-height:18px;white-space:pre-line}
  details{margin-top:6px} summary{cursor:pointer;color:var(--dim);font-size:13px}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1><b>샤오홍슈</b> 체험단 관리</h1>
  <div class="sub">업체 등록 · 진행 현황 · 광고주 전용링크 — 수집은 1시간마다 자동</div>

  <!-- 로그인 -->
  <div class="card" id="login-card">
    <label>이메일</label><input id="em" type="email" autocomplete="username">
    <label>비밀번호</label><input id="pw" type="password" autocomplete="current-password">
    <div class="row"><button onclick="login()">로그인</button><span class="msg" id="login-msg"></span></div>
  </div>

  <div id="app" class="hide">
    <!-- 업체 등록 -->
    <div class="card">
      <details id="reg-box"><summary>➕ 새 업체 등록</summary>
        <div style="margin-top:10px">
          <label>업체명 (광고주에게 보일 이름)</label><input id="f-name" placeholder="예: 23플래터">
          <label>노션 페이지 주소</label><input id="f-url" placeholder="https://....notion.site/....">
          <label>광고주 담당자 휴대폰 (알림톡용 · 선택)</label><input id="f-phone" placeholder="010...">
          <div class="row"><button onclick="addClient()">등록</button>
            <span class="msg" id="reg-msg"></span></div>
          <div class="lnk">등록하면 다음 자동 수집(최대 1시간) 때 광고주 화면이 만들어집니다.
            바로 만들려면 사무실 PC에서 지금확인.bat 을 실행하세요.</div>
        </div>
      </details>
    </div>

    <!-- 업체 목록 -->
    <div class="card"><div id="list">불러오는 중…</div></div>
    <div class="row">
      <button class="ghost btn-s" onclick="loadAll()">↻ 새로고침</button>
      <button class="ghost btn-s" onclick="logout()">로그아웃</button>
      <span class="msg" id="top-msg"></span>
    </div>
  </div>
</div>

<script>
const SB_URL = 'https://ndjxaikbjtolyvneeisv.supabase.co';
const SB_KEY = 'sb_publishable_vWn5MxEdB2sUuDZVshqZ2A_9bx8aTVA';
const PAGES_BASE = 'https://status.tesseramarketing.kr';
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = id => document.getElementById(id);

function pageUrl(t){ return PAGES_BASE + '/c/#t=' + t; }

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if (session){ $('login-card').classList.add('hide'); $('app').classList.remove('hide'); loadAll(); }
}
async function login(){
  $('login-msg').textContent = '확인 중…';
  const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
  if (error){ $('login-msg').textContent = '로그인 실패: ' + error.message; return; }
  $('login-msg').textContent = ''; boot();
}
async function logout(){ await sb.auth.signOut(); location.reload(); }

// 파이썬 make_slug 와 같은 규칙 — ascii 소문자·숫자·하이픈만
function makeSlug(name, taken){
  let s = name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'client';
  let base = s, n = 2;
  while (taken.has(s)) s = base + '-' + (n++);
  return s;
}
function makeToken(){
  const a = new Uint8Array(9); crypto.getRandomValues(a);
  return btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function addClient(){
  const name = $('f-name').value.trim(), url = $('f-url').value.trim(), phone = $('f-phone').value.trim();
  const m = $('reg-msg');
  if (!name || !url){ m.textContent = '업체명과 노션 주소는 필수입니다.'; return; }
  if (!url.includes('notion')){ m.textContent = '노션 주소가 아닌 것 같습니다.'; return; }
  m.textContent = '등록 중…';
  const { data: rows } = await sb.from('xhs_clients').select('slug');
  const slug = makeSlug(name, new Set((rows||[]).map(r=>r.slug)));
  const { error } = await sb.from('xhs_clients').insert(
    { name, notion_url: url, phone, slug, token: makeToken(), enabled: true });
  if (error){
    m.textContent = error.code === '23505' ? '이미 등록된 노션 주소입니다.' : '실패: ' + error.message;
    return;
  }
  m.textContent = ''; $('f-name').value = $('f-url').value = $('f-phone').value = '';
  $('reg-box').open = false; loadAll();
}

async function setEnabled(id, v){
  await sb.from('xhs_clients').update({ enabled: v }).eq('id', id); loadAll();
}
async function delClient(id, name){
  if (!confirm('[' + name + '] 을 삭제할까요?\n광고주 링크도 다음 수집 때부터 갱신이 멈춥니다.')) return;
  await sb.from('xhs_clients').delete().eq('id', id); loadAll();
}
function copy(text, btn){
  navigator.clipboard.writeText(text).then(()=>{
    const o = btn.textContent; btn.textContent = '✅ 복사됨';
    setTimeout(()=>{ btn.textContent = o; }, 1500);
  });
}

async function loadAll(){
  const [{ data: cs, error: e1 }, { data: sts }] = await Promise.all([
    sb.from('xhs_clients').select('*').order('id'),
    sb.from('xhs_state').select('*')
  ]);
  if (e1){ $('list').textContent = '불러오기 실패: ' + e1.message; return; }
  const st = {}; (sts||[]).forEach(s => st[s.slug] = s);
  if (!cs || !cs.length){ $('list').innerHTML = '<div class="st">등록된 업체가 없습니다 — 위에서 등록하세요.</div>'; return; }
  const html = [];   // 반복문 안 innerHTML += 금지 (CRM 렌더 규칙)
  for (const c of cs){
    const s = st[c.slug], sum = s && s.summary || {};
    const badge = !c.enabled ? '<span class="badge b-off">중지됨</span>'
      : !s ? '<span class="badge b-warn">수집 대기</span>'
      : s.ok ? '<span class="badge b-ok">정상</span>'
      : '<span class="badge b-warn">수집 실패</span>';
    const stat = s ? `진행 <b>${sum.total??'-'}</b>명 · 리뷰 <b>${sum.uploaded??'-'}</b> · 대기 ${sum.visited??0} · 예정 ${sum.scheduled??'-'} · 섭외 ${sum.recruited??'-'} · 취소 ${sum.cancelled??'-'}
      <br>마지막 확인 ${s.fetched_at||'—'} · 마지막 변경 ${s.last_change||'—'}${s.ok?'':'<br>⚠ '+(s.reason||'')}`
      : '아직 수집 전입니다 (다음 자동 수집 때 채워집니다)';
    const link = pageUrl(c.token);
    html.push(`<div class="cl">
      <div class="row" style="justify-content:space-between">
        <span class="nm">${esc(c.name)} ${badge}</span>
        <span class="row">
          <button class="btn-s" onclick="copy('${link}', this)">📋 광고주 링크 복사</button>
          <a class="ghost btn-s" style="text-decoration:none;padding:6px 12px;border-radius:8px" href="${link}" target="_blank">열기</a>
        </span>
      </div>
      <div class="st">${stat}</div>
      <details><summary>상세 · 설정</summary>
        <div class="lnk" style="margin:6px 0">노션: <a href="${esc(c.notion_url)}" target="_blank" style="color:var(--dim)">${esc(c.notion_url)}</a><br>
        담당자: ${esc(c.phone||'—')} · 등록 ${(c.created_at||'').slice(0,10)}</div>
        <div class="row">
          ${c.enabled
            ? `<button class="ghost btn-s" onclick="setEnabled(${c.id}, false)">⏸ 감시 중지</button>`
            : `<button class="btn-s" onclick="setEnabled(${c.id}, true)">▶ 감시 재개</button>`}
          <button class="ghost btn-s" onclick="delClient(${c.id}, '${esc(c.name)}')">🗑 삭제</button>
        </div>
      </details>
    </div>`);
  }
  $('list').innerHTML = html.join('');
}
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
boot();
</script>
</body>
</html>
