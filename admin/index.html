<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>샤오홍슈 체험단 관리</title>

<!-- 나·직원용 관리화면. deploy_pages.py 가 {{...}} 를 채워 GitHub Pages 에 올리는 셸이다.
     데이터는 전부 로그인해야만 보인다 (publishable 키는 공개용으로 설계된 키).
     ⛔업체명·토큰·노션주소를 이 파일에 넣지 말 것 — 공개 레포다. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* 광고주 뷰어와 같은 토큰 체계. 여기는 하루 종일 들여다보는 작업 화면이라
   대비를 조금 더 세우고 밀도를 높였다. */
:root{
  --ground:#FBF9F9; --surface:#FFFFFF; --raise:#F5F1F2; --sink:#F0EBEC;
  --ink:#191214;    --ink-2:#5C5054;  --ink-3:#8A7E81;
  --line:#EBE3E4;   --line-2:#DCD2D4;
  --brand:#F0263C;
  --ok:#0D7A5F;     --ok-bg:#E4F1EC;
  --warn:#B07314;   --warn-bg:#F7EEDD;
  --idle:#8A7E81;   --idle-bg:#EFEAEB;
  --shadow:0 1px 2px rgba(25,18,20,.04), 0 8px 24px -14px rgba(25,18,20,.12);
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#131011; --surface:#1C1618; --raise:#241D20; --sink:#100D0E;
    --ink:#F2ECED;   --ink-2:#B4A8AB;  --ink-3:#8D8083;
    --line:#2C2326;  --line-2:#3A2F32;
    --brand:#FF4257;
    --ok:#3FC79E;    --ok-bg:#123329;
    --warn:#E3A63C;  --warn-bg:#33280F;
    --idle:#8D8083;  --idle-bg:#272022;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --ground:#131011; --surface:#1C1618; --raise:#241D20; --sink:#100D0E;
  --ink:#F2ECED;   --ink-2:#B4A8AB;  --ink-3:#8D8083;
  --line:#2C2326;  --line-2:#3A2F32; --brand:#FF4257;
  --ok:#3FC79E;    --ok-bg:#123329;  --warn:#E3A63C; --warn-bg:#33280F;
  --idle:#8D8083;  --idle-bg:#272022; --shadow:none;
}
:root[data-theme="light"]{
  --ground:#FBF9F9; --surface:#FFFFFF; --raise:#F5F1F2; --sink:#F0EBEC;
  --ink:#191214;   --ink-2:#5C5054;  --ink-3:#8A7E81;
  --line:#EBE3E4;  --line-2:#DCD2D4; --brand:#F0263C;
  --ok:#0D7A5F;    --ok-bg:#E4F1EC;  --warn:#B07314; --warn-bg:#F7EEDD;
  --idle:#8A7E81;  --idle-bg:#EFEAEB;
  --shadow:0 1px 2px rgba(25,18,20,.04), 0 8px 24px -14px rgba(25,18,20,.12);
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; padding:0; background:var(--ground); color:var(--ink);
  font:400 15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
       "Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  font-variant-numeric:tabular-nums}
.wrap{max-width:940px; margin:0 auto; padding:26px 16px 72px;
  display:flex; flex-direction:column; gap:14px}

.head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap}
.head h1{margin:0; font-size:21px; font-weight:800; letter-spacing:-.035em}
.head h1 span{color:var(--brand)}
.head .sub{font-size:12.5px; color:var(--ink-3)}

.card{background:var(--surface); border:1px solid var(--line); border-radius:14px;
  box-shadow:var(--shadow); padding:18px}
.card.flat{padding:0; overflow:hidden}

label{display:block; font-size:12px; font-weight:600; color:var(--ink-2); margin-bottom:5px}
label .hint{font-weight:400; color:var(--ink-3)}
input{font:inherit; width:100%; padding:9px 11px; border-radius:9px;
  border:1px solid var(--line-2); background:var(--sink); color:var(--ink)}
input::placeholder{color:var(--ink-3)}
input:focus-visible{outline:2px solid var(--brand); outline-offset:1px; border-color:transparent}
.field{margin-bottom:12px}
.fields2{display:grid; grid-template-columns:1fr 1fr; gap:12px}

button{font:inherit; font-weight:700; letter-spacing:-.01em; cursor:pointer;
  padding:9px 15px; border-radius:9px; border:1px solid transparent;
  background:var(--brand); color:#fff}
button:hover{filter:brightness(1.07)}
button.ghost{background:transparent; color:var(--ink-2); border-color:var(--line-2)}
button.ghost:hover{filter:none; color:var(--ink); border-color:var(--ink-3)}
button.sm{padding:6px 11px; font-size:13px; border-radius:8px}
button:disabled{opacity:.5; cursor:default}
button:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

summary{cursor:pointer; font-size:14px; font-weight:700; color:var(--ink-2); list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"＋"; margin-right:7px; color:var(--brand); font-weight:800}
details[open] summary::before{content:"−"}
summary:focus-visible{outline:2px solid var(--brand); outline-offset:3px; border-radius:4px}
.reg-body{margin-top:14px; padding-top:14px; border-top:1px solid var(--line)}

.msg{font-size:12.5px; color:var(--warn); min-height:17px; white-space:pre-line}
.msg.ok{color:var(--ok)}
.hint-line{font-size:12px; color:var(--ink-3); margin-top:8px; line-height:1.6}

/* ── 업체 목록 — 기본 접힘. 업체가 늘어도 한눈에 훑히게. ── */
.client{border-top:1px solid var(--line)}
.client:first-child{border-top:none}
.client > summary{list-style:none; cursor:pointer; padding:15px 18px;
  display:flex; align-items:center; justify-content:space-between; gap:10px 12px; flex-wrap:wrap}
.client > summary::-webkit-details-marker{display:none}
.client > summary:hover{background:var(--raise)}
.client > summary:focus-visible{outline:2px solid var(--brand); outline-offset:-2px}
.client[open] > summary{background:var(--raise)}
.caret{flex:none; width:13px; color:var(--ink-3); font-size:11px; transition:transform .15s ease}
.client[open] .caret{transform:rotate(90deg)}
.c-body{padding:2px 18px 18px}
.c-name{font-size:16.5px; font-weight:750; letter-spacing:-.02em;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.pill{font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; letter-spacing:-.01em}
.p-ok{background:var(--ok-bg); color:var(--ok)}
.p-warn{background:var(--warn-bg); color:var(--warn)}
.p-off{background:var(--idle-bg); color:var(--idle)}

/* 한 줄에 진행이 다 읽히게 — 숫자는 크게, 이름표는 작게 */
.stats{display:flex; flex-wrap:wrap; gap:4px 18px; margin:11px 0 3px}
.stat{display:flex; align-items:baseline; gap:5px; font-size:12.5px; color:var(--ink-3)}
.stat b{font-size:16px; font-weight:750; color:var(--ink); letter-spacing:-.02em}
.stat.acc b{color:var(--brand)}
.when{font-size:12px; color:var(--ink-3); margin-top:6px}
.when.bad{color:var(--warn)}

/* 계약 입력줄 — 자주 고치는 값이라 상세를 펼치지 않고 카드에서 바로 */
.deal{margin-top:12px; padding:11px 12px; background:var(--raise); border-radius:11px;
  display:flex; flex-wrap:wrap; align-items:center; gap:9px 14px}
.deal .grp{display:flex; align-items:center; gap:7px}
.deal label{margin:0; white-space:nowrap; font-size:12px}
.deal input{width:66px; padding:6px 8px; text-align:center; background:var(--surface)}
.deal .sep{width:1px; align-self:stretch; background:var(--line-2)}
.deal .out{font-size:12.5px; color:var(--ink-2)}
.deal .out b{color:var(--ink); font-weight:700}
.deal .out.gap b{color:var(--warn)}

.real{font-size:12px; color:var(--ink-3); margin-top:8px}
.real b{color:var(--ink-2); font-weight:700}
.meta{margin-top:12px; padding-top:11px; border-top:1px dashed var(--line-2);
  font-size:12.5px; color:var(--ink-3); line-height:1.7; word-break:break-all;
  display:flex; flex-direction:column; gap:9px}
.meta a{color:var(--ink-2)}
.empty{padding:34px 18px; text-align:center; color:var(--ink-3); font-size:14px}

@media (max-width:600px){
  .wrap{padding:20px 12px 60px}
  .fields2{grid-template-columns:1fr}
  .c-head{align-items:flex-start; flex-direction:column}
  .deal{gap:9px 11px}
  .deal .sep{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <h1><span>샤오홍슈</span> 체험단 관리</h1>
    <div class="sub">수집은 30분마다 자동 · 광고주는 전용 링크만 봅니다</div>
  </header>

  <!-- 로그인 -->
  <div class="card" id="login-card">
    <div class="field"><label for="em">이메일</label>
      <input id="em" type="email" autocomplete="username"></div>
    <div class="field"><label for="pw">비밀번호</label>
      <input id="pw" type="password" autocomplete="current-password"></div>
    <div class="row"><button onclick="login()">로그인</button>
      <span class="msg" id="login-msg"></span></div>
  </div>

  <div id="app" hidden>
    <div class="card" style="margin-bottom:14px">
      <details id="reg-box"><summary>새 업체 등록</summary>
        <div class="reg-body">
          <div class="field"><label for="f-name">업체명 <span class="hint">— 광고주 화면에 그대로 보입니다</span></label>
            <input id="f-name" placeholder="예: 23플래터"></div>
          <div class="field"><label for="f-url">노션 페이지 주소 <span class="hint">— 외주사 페이지 주소창을 복사</span></label>
            <input id="f-url" placeholder="https://....notion.site/...."></div>
          <div class="fields2">
            <div class="field"><label for="f-count">계약 건수 <span class="hint">— 총 몇 명</span></label>
              <input id="f-count" type="number" min="1" max="999" placeholder="예: 15"></div>
            <div class="field"><label for="f-phone">광고주 담당자 휴대폰 <span class="hint">— 알림톡용, 선택</span></label>
              <input id="f-phone" placeholder="010..."></div>
          </div>
          <div class="fields2">
            <div class="field"><label for="f-f1k">계약 구성 · 1천 이상 <span class="hint">(명)</span></label>
              <input id="f-f1k" type="number" min="0" max="999" placeholder="예: 10"></div>
            <div class="field"><label for="f-f10k">계약 구성 · 1만 이상 <span class="hint">(명)</span></label>
              <input id="f-f10k" type="number" min="0" max="999" placeholder="예: 5"></div>
          </div>
          <div class="row"><button onclick="addClient()">등록</button>
            <span class="msg" id="reg-msg"></span></div>
          <div class="hint-line">등록하면 다음 자동 수집(최대 30분) 때 광고주 화면이 만들어집니다.
            바로 만들려면 사무실 PC에서 <b>지금확인.bat</b> 을 실행하세요.<br>
            계약 건수·구성은 나중에 목록에서 고쳐도 됩니다.</div>
        </div>
      </details>
    </div>

    <div class="card flat"><div id="list"><div class="empty">불러오는 중…</div></div></div>

    <div class="row" style="margin-top:14px">
      <button class="ghost sm" onclick="loadAll()">새로고침</button>
      <button class="ghost sm" onclick="logout()">로그아웃</button>
      <span class="msg" id="top-msg"></span>
    </div>
  </div>
</div>

<script>
const SB_URL = 'https://ndjxaikbjtolyvneeisv.supabase.co';
const SB_KEY = 'sb_publishable_vWn5MxEdB2sUuDZVshqZ2A_9bx8aTVA';
const PAGES_BASE = 'https://status.tesseramarketing.kr';
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = id => document.getElementById(id);

/* 광고주 링크 — 토큰은 해시(#) 뒤에 둔다. 해시는 서버로 전송되지 않아 접근 로그에도 안 남는다. */
function pageUrl(t){ return PAGES_BASE + '/c/#t=' + t; }
function esc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
/* 양의 정수만 유효. 파이썬 contract_num 과 같은 규칙 */
function cnum(v){ const n = parseInt(String(v ?? '').trim(), 10); return n > 0 ? n : null; }

const TIERS = [['f1k','1천 이상'], ['f10k','1만 이상']];

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if (session){ $('login-card').hidden = true; $('app').hidden = false; loadAll(); }
}
async function login(){
  $('login-msg').textContent = '확인 중…';
  const { error } = await sb.auth.signInWithPassword(
    { email: $('em').value.trim(), password: $('pw').value });
  if (error){ $('login-msg').textContent = '로그인 실패: ' + error.message; return; }
  $('login-msg').textContent = ''; boot();
}
async function logout(){ await sb.auth.signOut(); location.reload(); }

/* 파이썬 make_slug 와 같은 규칙 — ascii 소문자·숫자·하이픈만 */
function makeSlug(name, taken){
  let s = name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'client';
  let base = s, n = 2;
  while (taken.has(s)) s = base + '-' + (n++);
  return s;
}
function makeToken(){
  const a = new Uint8Array(9); crypto.getRandomValues(a);
  return btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
/* 컬럼이 아직 없을 때(스키마 SQL 미실행) 사람이 읽을 수 있는 안내로 바꾼다 */
function schemaHint(msg){
  return /contract_count|contract_tiers/.test(msg || '')
    ? '계약 칸이 아직 DB에 없습니다 — supabase_추가_계약건수.sql 을 SQL Editor 에서 실행하세요.'
    : null;
}

async function addClient(){
  const name = $('f-name').value.trim(), url = $('f-url').value.trim();
  const m = $('reg-msg'); m.className = 'msg';
  if (!name || !url){ m.textContent = '업체명과 노션 주소는 필수입니다.'; return; }
  if (!url.includes('notion')){ m.textContent = '노션 주소가 아닌 것 같습니다.'; return; }
  m.textContent = '등록 중…';

  const { data: rows } = await sb.from('xhs_clients').select('slug');
  const row = { name, notion_url: url, phone: $('f-phone').value.trim(),
    slug: makeSlug(name, new Set((rows||[]).map(r => r.slug))),
    token: makeToken(), enabled: true };
  const cc = cnum($('f-count').value);
  if (cc) row.contract_count = cc;
  const tiers = {};
  TIERS.forEach(([k]) => { const v = cnum($('f-' + k).value); if (v) tiers[k] = v; });
  if (Object.keys(tiers).length) row.contract_tiers = tiers;

  const { error } = await sb.from('xhs_clients').insert(row);
  if (error){
    m.textContent = error.code === '23505' ? '이미 등록된 노션 주소입니다.'
      : (schemaHint(error.message) || '실패: ' + error.message);
    return;
  }
  m.textContent = '';
  ['f-name','f-url','f-phone','f-count','f-f1k','f-f10k'].forEach(id => $(id).value = '');
  $('reg-box').open = false; loadAll();
}

/* 계약 값 저장 — 목록을 다시 그리지 않는다. 입력 중 다시 그리면 포커스가 날아가 못 쓴다.
   광고주 화면에는 다음 열람 때 바로 반영된다 (RPC 가 이 칸들을 직접 읽는다). */
async function saveDeal(id, el){
  const msg = $('deal-msg-' + id);
  const box = el.closest('.deal');
  const count = cnum(box.querySelector('.in-count').value);
  const tiers = {};
  TIERS.forEach(([k]) => { const v = cnum(box.querySelector('.in-' + k).value); if (v) tiers[k] = v; });

  msg.className = 'msg'; msg.textContent = '저장 중…';
  const { error } = await sb.from('xhs_clients')
    .update({ contract_count: count, contract_tiers: Object.keys(tiers).length ? tiers : null })
    .eq('id', id);
  if (error){ msg.textContent = schemaHint(error.message) || error.message; return; }

  el.value = cnum(el.value) ?? '';
  msg.className = 'msg ok';
  msg.textContent = count ? '저장됨 · 계약 ' + count + '건' : '저장됨 · 계약 표시 안 함';
  setTimeout(() => { msg.textContent = ''; msg.className = 'msg'; }, 4000);

  const out = $('deal-out-' + id);
  if (out){
    const tot = out.dataset.total;
    out.innerHTML = (count && tot !== '')
      ? '확보 <b>' + tot + '</b>명 · <span class="' +
        (Math.max(0, count - Number(tot)) ? 'gap' : '') + '">남은 자리 <b>' +
        Math.max(0, count - Number(tot)) + '</b>건</span>'
      : '';
  }
}

async function setEnabled(id, v){ await sb.from('xhs_clients').update({ enabled: v }).eq('id', id); loadAll(); }
async function delClient(id, name){
  if (!confirm('[' + name + '] 을 삭제할까요?\n광고주 링크도 다음 수집 때부터 갱신이 멈춥니다.')) return;
  await sb.from('xhs_clients').delete().eq('id', id); loadAll();
}
/* 광고주 링크 복사. ⭐실패했을 때 조용히 아무 일도 안 하면 안 된다 —
   복사됐다고 믿고 빈 클립보드를 붙여넣게 된다. 권한이 막히면 옛 방식으로 한 번 더 시도하고,
   그것도 안 되면 주소를 띄워 손으로 복사할 수 있게 한다. */
function copy(text, btn){
  const done = () => {
    const o = btn.textContent; btn.textContent = '복사됨'; btn.disabled = true;
    setTimeout(() => { btn.textContent = o; btn.disabled = false; }, 1600);
  };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;top:0;opacity:0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    if (ok) done(); else prompt('아래 주소를 복사해 광고주에게 보내세요', text);
  };
  if (!navigator.clipboard) return fallback();
  // ⭐거부도 성공도 안 하고 **그냥 멈추는** 경우가 있다 (창이 포커스를 잃었을 때,
  //   카톡·인스타 인앱 브라우저 등). 시간 제한을 안 두면 눌러도 아무 일도 안 일어난다.
  Promise.race([
    navigator.clipboard.writeText(text),
    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 1200)),
  ]).then(done, fallback);
}

async function loadAll(){
  const [{ data: cs, error: e1 }, { data: sts }] = await Promise.all([
    sb.from('xhs_clients').select('*').order('id'),
    sb.from('xhs_state').select('*')
  ]);
  if (e1){ $('list').innerHTML = '<div class="empty">불러오기 실패: ' + esc(e1.message) + '</div>'; return; }
  const st = {}; (sts || []).forEach(s => st[s.slug] = s);
  if (!cs || !cs.length){
    $('list').innerHTML = '<div class="empty">등록된 업체가 없습니다 — 위에서 등록하세요.</div>'; return;
  }

  const html = [];                       // 반복문 안 innerHTML += 금지 (CRM 렌더 규칙)
  for (const c of cs){
    const s = st[c.slug], sum = (s && s.summary) || {};
    const pill = !c.enabled ? '<span class="pill p-off">중지됨</span>'
      : !s ? '<span class="pill p-warn">수집 대기</span>'
      : s.ok ? '<span class="pill p-ok">정상</span>'
      : '<span class="pill p-warn">수집 실패</span>';

    const stats = s ? `<div class="stats">
        <span class="stat acc"><b>${sum.uploaded ?? 0}</b>리뷰 업로드</span>
        <span class="stat"><b>${sum.total ?? 0}</b>확보 인원</span>
        <span class="stat"><b>${sum.visited ?? 0}</b>리뷰 대기</span>
        <span class="stat"><b>${sum.scheduled ?? 0}</b>방문 예정</span>
        <span class="stat"><b>${sum.recruited ?? 0}</b>일정 미정</span>
        <span class="stat"><b>${sum.cancelled ?? 0}</b>취소</span>
      </div>
      <div class="when${s.ok ? '' : ' bad'}">확인 ${esc(s.fetched_at || '—')} · 변경 ${esc(s.last_change || '—')}${
        s.ok ? '' : '<br>⚠ ' + esc(s.reason || '수집 실패')}</div>`
      : '<div class="when">아직 수집 전입니다 (다음 자동 수집 때 채워집니다)</div>';

    const tot = (s && sum.total != null) ? String(sum.total) : '';
    const cc = c.contract_count, t = c.contract_tiers || {};
    const gap = cc && tot !== '' ? Math.max(0, cc - Number(tot)) : null;
    const out = (cc && tot !== '')
      ? `확보 <b>${tot}</b>명 · <span class="${gap ? 'gap' : ''}">남은 자리 <b>${gap}</b>건</span>` : '';
    // 실제 섭외 팔로워 구성 — 계약값과 다를 수 있어서 여기(내부)에만 띄운다.
    const real = sum.f_known
      ? `<div class="real">실제 섭외 · ${TIERS.map(([k, l]) =>
          `${l} <b>${sum[k] ?? 0}</b>명`).join(' · ')}
         <span style="color:var(--ink-3)">— 광고주 화면에는 위 계약값만 나갑니다</span></div>` : '';
    const link = pageUrl(c.token);

    // 기본 접힘 — 펼쳐야 현황·계약·설정이 나온다. 접힌 줄에는 이름과 상태만 둔다.
    // 링크 복사·열기는 '정보'가 아니라 매일 쓰는 동작이라 접힌 채로도 눌릴 수 있게 둔다
    // (summary 안의 버튼은 preventDefault 로 펼침을 막는다).
    html.push(`<details class="client">
      <summary>
        <div class="c-name"><span class="caret">▶</span>${esc(c.name)} ${pill}</div>
        <div class="row" onclick="event.preventDefault(); event.stopPropagation()">
          <button class="sm" onclick="copy('${link}', this)">광고주 링크 복사</button>
          <button class="ghost sm" onclick="window.open('${link}','_blank')">열기</button>
        </div>
      </summary>
      <div class="c-body">
      ${stats}
      <div class="deal">
        <div class="grp"><label for="d-count-${c.id}">계약 건수</label>
          <input class="in-count mono" id="d-count-${c.id}" type="number" min="0" max="999"
                 value="${cc ?? ''}" placeholder="—" onchange="saveDeal(${c.id}, this)"></div>
        <div class="sep"></div>
        <div class="grp"><label for="d-f1k-${c.id}">1천 이상</label>
          <input class="in-f1k mono" id="d-f1k-${c.id}" type="number" min="0" max="999"
                 value="${t.f1k ?? ''}" placeholder="—" onchange="saveDeal(${c.id}, this)"></div>
        <div class="grp"><label for="d-f10k-${c.id}">1만 이상</label>
          <input class="in-f10k mono" id="d-f10k-${c.id}" type="number" min="0" max="999"
                 value="${t.f10k ?? ''}" placeholder="—" onchange="saveDeal(${c.id}, this)"></div>
        <div class="out" id="deal-out-${c.id}" data-total="${tot}">${out}</div>
        <span class="msg" id="deal-msg-${c.id}"></span>
      </div>
      ${real}
      <div class="meta">
        <div>노션 <a href="${esc(c.notion_url)}" target="_blank" rel="noopener">${esc(c.notion_url)}</a></div>
        <div>담당자 ${esc(c.phone || '—')} · 등록 ${esc((c.created_at || '').slice(0, 10))}</div>
        <div class="row">
          ${c.enabled
            ? `<button class="ghost sm" onclick="setEnabled(${c.id}, false)">감시 중지</button>`
            : `<button class="sm" onclick="setEnabled(${c.id}, true)">감시 재개</button>`}
          <button class="ghost sm" onclick="delClient(${c.id}, '${esc(c.name)}')">삭제</button>
        </div>
      </div>
      </div>
    </details>`);
  }
  $('list').innerHTML = html.join('');
}
boot();
</script>
</body>
</html>
